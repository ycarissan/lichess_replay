<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lichess — Puzzles ratés</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#4a7a3c">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
</head>
<body>
  <main class="center-box">
    <h1>♟️ Rejouer ses puzzles ratés</h1>
    <p>Connectez-vous avec votre compte Lichess pour récupérer et rejouer vos
       10 derniers puzzles ratés.</p>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <a class="btn" href="{{ url_for('login') }}">Se connecter avec Lichess</a>
    <p class="hint" style="margin-top:1rem;">
      Vous êtes entraîneur et gérez des classes ?
      <a href="{{ url_for('login_email') }}">Connexion par email</a>
    </p>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
